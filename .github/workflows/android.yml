name: Android checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject personal emails in Git history
        run: ./.githooks/check-email-privacy history
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests, lint and debug APK
        run: ./gradlew :v2:testDebugUnitTest :v2:lintDebug :v2:assembleDebug
